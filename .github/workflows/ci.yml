name: test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate backend release contract
        run: python scripts/release_gate.py --json

  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "11.9.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint web application
        run: pnpm lint
      - name: Build web application
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run project navigation E2E
        run: pnpm test:e2e

  packaged-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create CI runtime environment
        run: |
          printf '%s\n' \
            'NEO4J_PASSWORD=ci-factorygraph-password' \
            'P3_API_PROVIDER=gold' \
            > .env.ci
      - name: Validate Compose contract
        run: >-
          docker compose
          --env-file .env.ci
          -f infra/docker-compose.product.yml
          config --quiet
      - name: Run fresh-environment release gate
        env:
          P3_RELEASE_ENV_FILE: .env.ci
        run: ./scripts/fresh_release_gate.sh
        timeout-minutes: 15
